# ===== SETUP (Cloudflare Workers, free tier — no KV/database to create) =====
# 1) npm i -g wrangler && wrangler login
# 2) Secrets (never put these in index.html):
#      wrangler secret put GROQ_API_KEY      (from console.groq.com)
#      wrangler secret put BOT_TOKEN         (from @BotFather)
#      wrangler secret put WEBHOOK_SECRET    (any random string, A-Z a-z 0-9 _ -)
# 3) Edit [vars] below:
#      ALLOWED_UIDS = team Telegram user IDs (comma separated) -> use the bot + get customer chat alerts
#      ADMIN_UIDS   = approvers (also get alerts). Get an ID by messaging @userinfobot.
#    IMPORTANT: every team member must open the bot and press /start once,
#    otherwise Telegram does not allow the bot to message them.
# 4) wrangler deploy
# 5) Connect the bot (sets webhook, command menu and bot name "CHDS Report"):
#      curl -X POST https://<your-worker>.workers.dev/api/setup -H "X-Setup-Key: <WEBHOOK_SECRET>"
#    Expected result: {"webhook":true,"commands":true,"name":true}
# 6) In index.html set CONFIG.API = "https://<your-worker>.workers.dev"
#    and host index.html anywhere (Cloudflare Pages, Netlify, GitHub Pages...).
# 7) Optional: set ALLOWED_ORIGIN to your site URL so only it can call the API.
name = "ch-team-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub", "Room"]

[vars]
ALLOWED_UIDS = "111111111,222222222"
ADMIN_UIDS = "111111111"
ALLOWED_ORIGIN = "*"
CURRENCY = "$"
TZ_OFFSET = "8"
